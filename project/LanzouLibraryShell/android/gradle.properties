org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Maintainer SDK and dependency caches are relocatable as a single D-drive
# toolchain root. Disable incremental Kotlin storage to avoid stale absolute paths.
kotlin.incremental=false
# Keep Kotlin compilation inside the canonical D-drive Gradle process. The
# daemon otherwise creates its run-file registry under the Windows user profile.
kotlin.compiler.execution.strategy=in-process
# The shell APK is a secure repackaging template. AAPT2 path shortening can
# assign the same ZIP path to distinct resources, which the Rust packager must
# reject as ambiguous. Keep resource paths unique in this template build.
android.enableResourceOptimizations=false
