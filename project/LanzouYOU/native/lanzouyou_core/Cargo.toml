[package]
name = "lanzouyou_core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
apksig = { version = "0.4", default-features = false, features = ["hash", "signing"] }
base64 = "0.22"
editpe = { path = "vendor/editpe" }
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "ico", "jpeg", "png", "webp"] }
libc = "0.2"
once_cell = "1.20"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["ring"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "gzip", "json", "multipart", "rustls-tls"] }
resand = { version = "0.3", features = ["derive"] }
rsa = "0.9"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.52", features = ["net", "rt-multi-thread", "time"] }
x509-cert = "0.2"
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.15"
