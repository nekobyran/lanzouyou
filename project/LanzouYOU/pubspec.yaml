name: lanzouyou
description: "LanzouYOU Flutter and Rust cloud file manager."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  crypto: ^3.0.7
  ffi: ^2.1.4
  file_picker: ^11.0.2
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  lanzou_library_shell:
    path: ../LanzouLibraryShell
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
